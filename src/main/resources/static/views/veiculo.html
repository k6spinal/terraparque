<h2>Cadastro de Veiculo</h2>

<form ng-submit="salvar()">
    <input type="text"
           ng-model="veiculo.placa"
           placeholder="Placa"
           required
           class="form-control mb-2">

    <input type="text"
           ng-model="veiculo.marcaModelo"
           placeholder="Marca / Modelo"
           required
           class="form-control mb-2">

    <button type="submit" class="btn btn-primary">
        Salvar
    </button>
</form>

<hr>

<table class="table table-bordered mt-3">
    <thead>
        <tr>
            <th>Placa</th>
            <th>Marca / Modelo</th>
        </tr>
    </thead>
    <tbody>
        <tr ng-repeat="v in veiculos">
            <td>{{v.placa}}</td>
            <td>{{v.marcaModelo}}</td>
        </tr>
    </tbody>
</table>
