<!DOCTYPE html>
<html lang="pt-br" ng-app="appCadastro">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Controle</title>

    <!-- ESSENCIAL PARA MOBILE -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Angular Material CSS -->
    <link rel="stylesheet"
          href="https://ajax.googleapis.com/ajax/libs/angular_material/1.2.3/angular-material.min.css">

    <!-- Opcional: ícones -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/icon?family=Material+Icons">

    <style>
        body {
            margin: 0;
        }
    </style>
</head>

<body layout="column" ng-cloak>

<md-toolbar>
    <div class="md-toolbar-tools">
        <h2>Controle de Portaria</h2>
        <span flex></span>

        <md-button class="md-raised md-primary" href="#!/veiculo">
            Veículos
        </md-button>

        <md-button class="md-raised md-primary" href="#!/colaborador">
            Colaboradores
        </md-button>

        <md-button class="md-raised md-warn" href="#!/saidaveiculos">
            Saída
        </md-button>
    </div>
</md-toolbar>


<!-- ===== CONTEÚDO DINÂMICO ===== -->
<md-content layout-padding flex>
    <div ng-view></div>
</md-content>

<!-- ================= SCRIPTS ================= -->

<!-- AngularJS -->
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-animate.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-aria.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-messages.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angular_material/1.2.3/angular-material.min.js"></script>

<!-- Angular Material -->
<script src="https://ajax.googleapis.com/ajax/libs/angular_material/1.2.3/angular-material.min.js"></script>

<!-- ngRoute -->
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>

<!-- App -->
<script src="app.js"></script>

<!-- Controllers -->
<script src="controllers/colaborador.controller.js"></script>
<script src="controllers/saidaVeiculo.controller.js"></script>
<script src="controllers/saidaVeiculoRetorno.controller.js"></script>
<script src="controllers/veiculo.controller.js"></script>

<style>
    .tabela-saida {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
    }

    .tabela-saida th,
    .tabela-saida td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #e0e0e0;
        word-wrap: break-word;
    }

    .tabela-saida th {
        font-weight: 600;
        background-color: #f5f5f5;
    }

    .tabela-saida tr:hover {
        background-color: #fafafa;
    }

    /* Corrige conflitos do Angular Material com tabelas */
.desktop-table table {
    width: 100%;
    border-collapse: collapse !important;
}

.desktop-table th,
.desktop-table td {
    border: 1px solid #dee2e6 !important;
    padding: 8px 12px !important;
    vertical-align: middle;
    text-align: left;
}

.desktop-table thead th {
    background-color: #343a40;
    color: #fff;
}

.desktop-table tbody tr:hover {
    background-color: #f5f5f5;
}
</style>

</body>
</html>
